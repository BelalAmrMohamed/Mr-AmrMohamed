<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Admin Sign In — Amr Mohamed Ahmed</title>
  <link rel="icon" href="../favicon.png" type="image/png" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;1,500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

  <style>
    /* ==========================================================
       Admin sign-in — adapted from the provided login template,
       themed to the site's navy / gold palette and Playfair/Inter type.
       ========================================================== */

    :root {
      --background: #faf9f6;
      --foreground: #152844;
      --card: #ffffff;
      --primary: #1e3a5f;
      --primary-foreground: #ffffff;
      --muted-foreground: #6b7a90;
      --border: #e3e0d6;
      --accent: #f3efe3;
      --accent-foreground: #152844;
      --ring: #c9a961;
      --input: #e3e0d6;
      --gold: #c9a961;
      --radius: 0.6rem;
      --font-serif: 'Playfair Display', ui-serif, Georgia, serif;
      --font-sans: 'Inter', ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      --ease-enter: cubic-bezier(0.22, 1, 0.36, 1);
    }

    @media (prefers-color-scheme: dark) {
      :root:not(.light) {
        --background: #0e1a2b;
        --foreground: #f4f1e8;
        --card: #152844;
        --primary: #c9a961;
        --primary-foreground: #152844;
        --muted-foreground: #9fb0c4;
        --border: rgba(255,255,255,0.1);
        --accent: #1e3a5f;
        --accent-foreground: #f4f1e8;
        --ring: #c9a961;
        --input: rgba(255,255,255,0.14);
      }
    }
    :root.dark {
      --background: #0e1a2b;
      --foreground: #f4f1e8;
      --card: #152844;
      --primary: #c9a961;
      --primary-foreground: #152844;
      --muted-foreground: #9fb0c4;
      --border: rgba(255,255,255,0.1);
      --accent: #1e3a5f;
      --accent-foreground: #f4f1e8;
      --ring: #c9a961;
      --input: rgba(255,255,255,0.14);
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { -webkit-text-size-adjust: 100%; }
    body {
      font-family: var(--font-sans);
      background: var(--background);
      color: var(--foreground);
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }
    svg { display: block; }
    a { color: inherit; text-decoration: none; }
    button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }

    .sr-only {
      position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
      overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0;
    }

    @keyframes enter {
      from { opacity: 0; transform: translateY(1rem); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .enter {
      animation: enter 600ms var(--ease-enter) both;
      animation-delay: calc(var(--i, 0) * 70ms);
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .spin { animation: spin 1s linear infinite; }
    @media (prefers-reduced-motion: reduce) {
      .enter, .spin { animation: none; }
    }

    .btn {
      display: inline-flex; align-items: center; justify-content: center;
      white-space: nowrap; border-radius: calc(var(--radius) - 2px);
      font-size: 0.9rem; line-height: 1.25rem; font-weight: 600;
      height: 2.75rem; padding: 0.5rem 1rem;
      transition: background-color 150ms, color 150ms, transform 150ms;
    }
    .btn:focus-visible {
      outline: none;
      box-shadow: 0 0 0 2px var(--background), 0 0 0 4px var(--ring);
    }
    .btn:disabled { pointer-events: none; opacity: 0.6; }
    .btn-default { background: var(--primary); color: var(--primary-foreground); }
    .btn-default:hover { transform: translateY(-1px); box-shadow: 0 6px 20px rgba(30,58,95,0.25); }
    .btn-lg { height: 2.9rem; padding-inline: 2rem; }
    .btn-full { width: 100%; }
    .btn-gap-2 { gap: 0.5rem; }
    #google-btn {
      background: var(--card); color: var(--foreground); border: 1px solid var(--border);
    }
    #google-btn:hover { transform: translateY(-1px); box-shadow: 0 6px 20px rgba(0,0,0,0.08); }
    #google-btn .icon { width: 1.15rem; height: 1.15rem; }

    .icon { width: 1.1rem; height: 1.1rem; flex-shrink: 0; }

    .login {
      position: relative;
      min-height: 100vh; min-height: 100svh;
      overflow: hidden;
      background: var(--background);
    }
    .login::before {
      content: "";
      display: none;
      position: absolute; z-index: 0;
      top: 0; bottom: 0; inset-inline-start: 0;
      width: 50%;
      background:
        linear-gradient(180deg, var(--dark-navy, #152844), #0e1a2b 70%);
    }
    .bg-paths { position: absolute; inset: 0; z-index: 0; overflow: hidden; pointer-events: none; opacity: 0.35; }
    .paths { position: absolute; inset: 0; pointer-events: none; }
    .paths svg { width: 100%; height: 100%; color: var(--gold); }
    .paths path { opacity: 0.55; }

    .login-aside {
      position: relative; z-index: 1;
      display: none;
      height: 100%;
      flex-direction: column;
      padding: 3rem;
      color: #f4f1e8;
    }

    .brand { position: relative; z-index: 10; display: flex; align-items: center; gap: 0.6rem; }
    .brand-mark {
      width: 2.5rem; height: 2.5rem; border-radius: 50%;
      background: linear-gradient(135deg, var(--gold), #e3c988);
      color: #152844;
      display: flex; align-items: center; justify-content: center;
      font-family: var(--font-serif); font-weight: 600; font-size: 1.1rem;
    }
    .brand-name { font-family: var(--font-serif); font-size: 1.1rem; font-weight: 500; letter-spacing: 0.01em; }
    .brand-sub { font-size: 0.75rem; color: #9fb0c4; margin-top: 0.1rem; }

    .quote { position: relative; z-index: 10; margin-top: auto; display: flex; flex-direction: column; gap: 0.9rem; }
    .quote blockquote { font-family: var(--font-serif); font-size: 1.65rem; line-height: 1.3; letter-spacing: -0.01em; font-weight: 500; }
    .quote figcaption { display: flex; align-items: center; gap: 0.5rem; font-size: 0.78rem; color: #9fb0c4; }
    .quote .sep { color: rgba(255,255,255,0.3); }

    .login-main {
      position: relative;
      display: flex; flex-direction: column; justify-content: center;
      min-height: 100vh; min-height: 100svh;
      padding: 5rem 2rem;
    }
    .main-glow { position: absolute; inset: 0; z-index: 0; pointer-events: none; opacity: 0.5; }
    .glow { position: absolute; top: 0; inset-inline-end: 0; border-radius: 9999px; }
    .glow-1 {
      height: 60rem; width: 32rem; transform: translateY(-18rem);
      background: radial-gradient(68% 68% at 55% 31%, rgba(201,169,97,0.12) 0, rgba(201,169,97,0.04) 50%, transparent 80%);
    }

    .panel {
      position: relative; z-index: 10;
      width: 100%; margin-inline: auto;
      display: flex; flex-direction: column; gap: 1.5rem;
    }
    .panel-brand { display: flex; align-items: center; gap: 0.6rem; }
    .panel-header { display: flex; flex-direction: column; gap: 0.5rem; }
    .panel-header h1 { font-family: var(--font-serif); font-size: 2rem; line-height: 1.15; font-weight: 500; letter-spacing: -0.01em; }
    .panel-header p { font-size: 0.9rem; color: var(--muted-foreground); }

    .form { display: flex; flex-direction: column; gap: 1.1rem; }
    .field { display: flex; flex-direction: column; gap: 0.45rem; }
    .label { font-size: 0.85rem; font-weight: 600; }

    .input {
      display: flex; width: 100%; height: 2.75rem;
      padding: 0.5rem 0.85rem;
      font: inherit; font-size: 1rem; color: inherit;
      background: var(--card);
      border: 1px solid var(--input);
      border-radius: calc(var(--radius) - 2px);
      transition: box-shadow 150ms, border-color 150ms;
    }
    .input::placeholder { color: var(--muted-foreground); }
    .input:focus-visible {
      outline: none; border-color: var(--ring);
      box-shadow: 0 0 0 3px color-mix(in srgb, var(--ring) 25%, transparent);
    }
    .input:disabled { cursor: not-allowed; opacity: 0.6; }

    .error-banner {
      display: none;
      font-size: 0.85rem;
      color: #b42318;
      background: #fef2f1;
      border: 1px solid #f3c6c2;
      border-radius: calc(var(--radius) - 2px);
      padding: 0.7rem 0.9rem;
    }
    .error-banner.is-visible { display: block; }

    .footnote { font-size: 0.78rem; color: var(--muted-foreground); }

    @media (min-width: 640px) {
      .panel { max-width: 24rem; }
      .panel-header h1 { font-size: 2.4rem; }
    }
    @media (min-width: 1024px) {
      .login { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .login::before { display: block; }
      .bg-paths { inset-inline-end: 50%; opacity: 1; }
      .login-aside { display: flex; }
      .login-main { min-height: 0; }
      .panel-brand { display: none; }
    }
  </style>
</head>

<body>
  <section class="login" data-slot="login">
    <div class="bg-paths" id="floating-paths" aria-hidden="true"></div>

    <aside class="login-aside" data-slot="login-aside">
      <div class="brand enter">
        <span class="brand-mark">AM</span>
        <div>
          <div class="brand-name">Amr Mohamed Ahmed</div>
          <div class="brand-sub">Admin Dashboard</div>
        </div>
      </div>

      <figure class="quote enter" style="--i: 4">
        <blockquote>
          “Thirty-two years in the classroom taught me one thing: you can&rsquo;t improve
          what you don&rsquo;t measure.”
        </blockquote>
        <figcaption>
          <span>English Language Supervisor</span>
          <span class="sep" aria-hidden="true">|</span>
          <span>Ministry of Education, Egypt</span>
        </figcaption>
      </figure>
    </aside>

    <div class="login-main" data-slot="login-main">
      <div class="main-glow" aria-hidden="true">
        <div class="glow glow-1"></div>
      </div>

      <a href="../index.html" class="btn btn-ghost btn-gap-2 enter" style="position:absolute; inset-inline-start:1.25rem; top:1.75rem; color: var(--muted-foreground);">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="m15 18-6-6 6-6" />
        </svg>
        Back to site
      </a>

      <div class="panel" data-slot="login-panel">
        <div class="panel-brand enter">
          <span class="brand-mark">AM</span>
          <span class="brand-name">Admin Dashboard</span>
        </div>

        <div class="panel-header" data-slot="login-header">
          <h1 class="enter" style="--i: 1">Welcome back, Mr. Amr.</h1>
          <p class="enter" style="--i: 2">
            Sign in to see how your website and AI assistant are doing, live.
          </p>
        </div>

        <div class="error-banner enter" id="error-banner" style="--i: 2" role="alert"></div>

        <div class="form enter" style="--i: 3">
          <button type="button" id="google-btn" class="btn btn-default btn-lg btn-full btn-gap-2">
            <span class="icon-slot" id="google-icon-slot" aria-hidden="true">
              <svg class="icon" viewBox="0 0 48 48" aria-hidden="true">
                <path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3c-1.6 4.7-6.1 8-11.3 8-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.9 1.2 8 3.1l5.7-5.7C34.6 6.1 29.6 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.7-.4-3.5z"/>
                <path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.7 15.1 19 12 24 12c3.1 0 5.9 1.2 8 3.1l5.7-5.7C34.6 6.1 29.6 4 24 4c-7.4 0-13.8 4.1-17.1 10.1z"/>
                <path fill="#4CAF50" d="M24 44c5.5 0 10.4-2.1 14.1-5.5l-6.5-5.5C29.6 34.6 26.9 36 24 36c-5.2 0-9.6-3.3-11.3-8l-6.6 5.1C9.9 39.6 16.4 44 24 44z"/>
                <path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.3-2.3 4.3-4.2 5.6l6.5 5.5C40.9 36.9 44 31.1 44 24c0-1.3-.1-2.7-.4-3.5z"/>
              </svg>
            </span>
            <span class="btn-label">Continue with Google</span>
          </button>
        </div>

        <span role="status" id="auth-status" class="sr-only"></span>

        <p class="footnote enter" style="--i: 4">
          Only Mr. Amr's and the developer's Google accounts can sign in — this page isn't linked anywhere on the public site.
        </p>
      </div>
    </div>
  </section>

  <script type="module">
    import { createClient } from "https://esm.sh/@supabase/supabase-js@2";

    const SPINNER_ICON =
      '<svg class="icon spin" viewBox="0 0 24 24" fill="none" stroke="currentColor" ' +
      'stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' +
      '<path d="M21 12a9 9 0 1 1-6.219-8.56"/></svg>';

    const googleBtn = document.getElementById("google-btn");
    const iconSlot = document.getElementById("google-icon-slot");
    const label = googleBtn.querySelector(".btn-label");
    const errorBanner = document.getElementById("error-banner");
    const statusEl = document.getElementById("auth-status");
    const originalIcon = iconSlot.innerHTML;

    function showError(msg) {
      errorBanner.textContent = msg;
      errorBanner.classList.add("is-visible");
    }
    function setPending(pending, text) {
      googleBtn.disabled = pending;
      iconSlot.innerHTML = pending ? SPINNER_ICON : originalIcon;
      label.textContent = text || (pending ? "Redirecting\u2026" : "Continue with Google");
      statusEl.textContent = pending ? (text || "Working") : "";
    }

    async function init() {
      let config;
      try {
        const resp = await fetch("/api/public-config");
        if (!resp.ok) throw new Error();
        config = await resp.json();
      } catch {
        showError("Couldn't load sign-in configuration. Please try again shortly.");
        setPending(true, "Unavailable");
        return;
      }

      const supabase = createClient(config.supabaseUrl, config.supabasePublishableKey);

      // Already signed in with an authorized account? Skip straight to the dashboard.
      const { data: { session } } = await supabase.auth.getSession();
      if (session) {
        setPending(true, "Already signed in\u2026");
        const ok = await verifyAndRedirect(session.access_token);
        if (!ok) await supabase.auth.signOut();
      }

      // After the OAuth redirect comes back here with a session, verify &
      // redirect. onAuthStateChange fires for both the initial getSession()
      // above and the post-redirect SIGNED_IN event.
      supabase.auth.onAuthStateChange(async (event, newSession) => {
        if (event === "SIGNED_IN" && newSession) {
          setPending(true, "Checking access\u2026");
          const ok = await verifyAndRedirect(newSession.access_token);
          if (!ok) {
            await supabase.auth.signOut();
            setPending(false);
          }
        }
      });

      async function verifyAndRedirect(accessToken) {
        try {
          const resp = await fetch("/api/admin/me", {
            headers: { Authorization: "Bearer " + accessToken },
          });
          if (resp.ok) {
            window.location.replace("dashboard.html");
            return true;
          }
          const data = await resp.json().catch(() => ({}));
          showError(data.error || "That Google account isn't authorized for this dashboard.");
          return false;
        } catch {
          showError("Couldn't reach the server. Check your connection and try again.");
          return false;
        }
      }

      googleBtn.addEventListener("click", async () => {
        errorBanner.classList.remove("is-visible");
        setPending(true, "Redirecting to Google\u2026");
        const { error } = await supabase.auth.signInWithOAuth({
          provider: "google",
          options: { redirectTo: window.location.href },
        });
        if (error) {
          showError(error.message || "Couldn't start Google sign-in.");
          setPending(false);
        }
      });
    }

    init();
  </script>

  <script>
    (function () {
      "use strict";
      var SVG_NS = "http://www.w3.org/2000/svg";
      var reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

      function jitter(i) {
        var value = Math.sin(i + 1) * 10000;
        return value - Math.floor(value);
      }

      function createFloatingPaths(position) {
        var wrap = document.createElement("div");
        wrap.className = "paths";
        var svg = document.createElementNS(SVG_NS, "svg");
        svg.setAttribute("fill", "none");
        svg.setAttribute("viewBox", "0 0 696 316");

        for (var i = 0; i < 30; i++) {
          var d =
            "M-" + (380 - i * 5 * position) + " -" + (189 + i * 6) +
            "C-" + (380 - i * 5 * position) + " -" + (189 + i * 6) +
            " -" + (312 - i * 5 * position) + " " + (216 - i * 6) +
            " " + (152 - i * 5 * position) + " " + (343 - i * 6) +
            "C" + (616 - i * 5 * position) + " " + (470 - i * 6) +
            " " + (684 - i * 5 * position) + " " + (875 - i * 6) +
            " " + (684 - i * 5 * position) + " " + (875 - i * 6);
          var path = document.createElementNS(SVG_NS, "path");
          path.setAttribute("d", d);
          path.setAttribute("stroke", "currentColor");
          path.setAttribute("stroke-opacity", (0.08 + i * 0.03).toFixed(2));
          path.setAttribute("stroke-width", (0.5 + i * 0.03).toFixed(2));
          path.setAttribute("pathLength", "1");
          path.style.strokeDasharray = "0.3 1";
          svg.appendChild(path);

          if (!reduceMotion && path.animate) {
            var duration = (22 + jitter(i) * 10) * 1000;
            var timing = { duration: duration, iterations: Infinity, easing: "linear" };
            path.animate([{ strokeDasharray: "0.3 1" }, { strokeDasharray: "1 1" }], timing);
            path.animate([{ strokeDashoffset: "0" }, { strokeDashoffset: "-1" }, { strokeDashoffset: "0" }], timing);
          }
        }
        wrap.appendChild(svg);
        return wrap;
      }

      var pathsHost = document.getElementById("floating-paths");
      if (pathsHost) {
        pathsHost.appendChild(createFloatingPaths(1));
        pathsHost.appendChild(createFloatingPaths(-1));
        var wide = window.matchMedia("(min-width: 1024px)");
        var applyAspect = function () {
          var mode = wide.matches ? "xMidYMid meet" : "xMidYMid slice";
          pathsHost.querySelectorAll("svg").forEach(function (el) {
            el.setAttribute("preserveAspectRatio", mode);
          });
        };
        applyAspect();
        wide.addEventListener("change", applyAspect);
      }

    })();
  </script>
</body>
</html>
